name: farm-bundle-tracker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${POSTGRES_ENV_FILE:-/etc/farm-bundle-tracker/postgres.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - application
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${BACKEND_ENV_FILE:-/etc/farm-bundle-tracker/backend.env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - application
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  application:
    driver: bridge

volumes:
  postgres_data:
